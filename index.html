<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Planetstafet</title>

  <style>
    body {
  font-family: Sono, Sono;

  background-image: url("background.avif");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;

  margin: 0;
  padding: 30px 20px;
  color: white;

  min-height: 100vh;
}

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .intro {
      text-align: center;
      margin-bottom: 30px;
    }

    /* POST BUTTONS */

    .post-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    /* Dette er startside knapperne */
    .post-button {
      padding: 22px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: #0D0D0D;
      color: white;
      cursor: pointer;
    }

    /* Dette er også startside knapperne, men den farve der skal være når man har cursor over knappen */
    .post-button:hover {
      background: #212121;
    }

    /* POST PAGE */

    #postPage {
      display: none;
    }

    select {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      border-radius: 10px;
      border: 1px solid #aaa;
      background: white;
      margin-bottom: 20px;
    }
/* Dette er selve boksen inde på hver post */
    .post-information {
  background: rgba(0, 0, 0, 0.88);
  color: #F2F2F2;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
}

    .post-information h2 {
  margin-top: 0;
  font-size: 30px;
  text-align: center;
}

    .post-description {
  font-size: 17px;
  line-height: 1.6;
  color: white;
  margin-bottom: 20px;
}

.post-image {
  width: 50%;
  border-radius: 17.5px;
  margin: 10px 0 25px 0;
  display: block;
}

.divider {
  border: none;
  border-top: 2px solid #eeeeee;
  margin: 25px 0;
}

.assignment {
  background: #292929;
  padding: 20px;
  border-radius: 12px;
}

.assignment h3 {
  margin-top: 0;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
}

.assignment p {
  font-size: 18px;
  line-height: 1.6;
  margin-bottom: 0;
}

.hint {
  margin-top: 18px;
  padding: 15px;
  background: #fff8dc;
  border-radius: 10px;
  font-size: 15px;
}

    .back-button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #292929;
      cursor: pointer;
    }

  </style>
</head>

<body>

<div class="container">

  <!-- START PAGE -->

  <div id="startPage">

    <h1>Solssystemets planeter</h1>

    <p class="intro">
      Hvilken planet er du ved?
    </p>

    <div class="post-buttons">

      <button class="post-button" onclick="openPost(1)">
        Merkur
      </button>

      <button class="post-button" onclick="openPost(2)">
        Venus
      </button>

      <button class="post-button" onclick="openPost(3)">
        Mars
      </button>

      <button class="post-button" onclick="openPost(4)">
        Jupiter
      </button>

      <button class="post-button" onclick="openPost(5)">
        Saturn
      </button>

      <button class="post-button" onclick="openPost(6)">
        Uranus & Neptun
      </button>

    </div>

  </div>


  <!-- POST PAGE -->

  <div id="postPage">

    <select id="postSelect" onchange="changePost()">

      <option value="1">Merkur</option>
      <option value="2">Venus</option>
      <option value="3">Mars</option>
      <option value="4">Jupiter</option>
      <option value="5">Saturn</option>
      <option value="6">Uranus & Neptun</option>

    </select>

    <div
      id="postInformation"
      class="post-information">
    </div>

    <button
      class="back-button"
      onclick="goBack()">

      ← Tilbage til oversigt over hele solsystemet

    </button>

  </div>

</div>


<script>

  const posts = {

    1: `
  <h2>MERKUR</h2>

  <img
    class="post-image"
    src="merkur_pic.jpg.webp"
    alt="Post 1"
  >


  <p class="post-description">
    Merkur er solsystemets inderste planet, så den ligger altså tættest på solen. Derudover er det også den planet der kommer hurtigst rundt omkring solen, for det gør den faktisk kun på 88 dage!
  </p>


  <hr class="divider">

  <div class="assignment">

    <h3>Hvad skal du gøre her?</h3>

    <p>
      Se hvor hurtigt du kan være. Løb fra start til slut, og tag tid på hvor hurtigt du kan gøre det. Se hvem af jeres gruppe der er hurtigst, ligesom Merkur! 
    </p>
  </div>
`,

    2: `
      <h2>Venus</h2>
      <p>Information for Post 2 will go here.</p>
    `,

    3: `
      <h2>Mars</h2>
      <p>Information for Post 3 will go here.</p>
    `,

    4: `
      <h2>Jupiter</h2>
      <p>Information for Post 4 will go here.</p>
    `,

    5: `
      <h2>Saturn</h2>
      <p>Information for Post 5 will go here.</p>
    `,

    6: `
      <h2>Uranus & Neptun</h2>
      <p>Information for Post 6 will go here.</p>
    `

  };


  function openPost(postNumber) {

    document.getElementById("startPage").style.display = "none";

    document.getElementById("postPage").style.display = "block";

    document.getElementById("postSelect").value = postNumber;

    document.getElementById("postInformation").innerHTML =
      posts[postNumber];

    window.scrollTo(0, 0);

  }


  function changePost() {

    const postNumber =
      document.getElementById("postSelect").value;

    document.getElementById("postInformation").innerHTML =
      posts[postNumber];

    window.scrollTo(0, 0);

  }


  function goBack() {

    document.getElementById("postPage").style.display = "none";

    document.getElementById("startPage").style.display = "block";

    window.scrollTo(0, 0);

  }

</script>

</body>

</html>
